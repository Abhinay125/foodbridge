<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodBridge</title>

    <!-- Map library -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Styles -->
    <link rel="stylesheet" href="/src/styles/main.css">
</head>

<body>

<aside class="sidebar">

    <div class="logo">
        <button
            type="button"
            class="profile-circle"
            id="profileButton"
            aria-label="Open user profile">F</button>

        <div class="brand">
            <span class="leaf">🍃</span> FoodBridge
        </div>
    </div>

    <nav class="nav" aria-label="Main navigation">

        <button class="active" data-page="home" type="button">
            <span class="icon">🍽️</span>
            <span data-i18n="food">Food</span>
        </button>

        <button data-page="donate" type="button">
            <span class="icon">💚</span>
            <span data-i18n="donate">Donate</span>
        </button>

        <button data-page="map" type="button">
            <span class="icon">📍</span>
            <span data-i18n="maps">Maps</span>
        </button>

        <button data-page="organisations" type="button">
            <span class="icon">🏢</span>
            <span data-i18n="organisations">Organisations</span>
        </button>

        <button data-page="messages" type="button" id="messagesNav">
            <span class="icon">💬</span>
            <span data-i18n="messages">Messages</span>
            <span class="badge" id="messageBadge" hidden>0</span>
        </button>

        <button data-page="settings" type="button">
            <span class="icon">⚙️</span>
            <span data-i18n="settings">Settings</span>
        </button>

    </nav>
</aside>

<main class="main">
    <div id="app-content"></div>
</main>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
